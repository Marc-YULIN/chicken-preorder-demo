<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>桶仔雞預訂示範</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: bright single-theme page. Sticky clock bar, then two big panels (customer's LINE phone, owner console).
   A guided tour dims the page, spotlights one thing at a time and explains it in a large bottom card. */
:root{
  color-scheme:light;
  --bg:#f3f6fa; --surface:#ffffff; --surface-2:#eef2f7; --ink:#16202b; --muted:#4f5b69; --line:#d5dde7;
  --ember:#cf4b0b; --ember-soft:#fff0e5; --on-ember:#ffffff;
  --cust:#0a7a45; --cust-soft:#e2f5ea;
  --ok:#1d7a34; --ok-soft:#e4f5e9; --warn:#985200; --warn-soft:#fff2dc; --bad:#c42626; --bad-soft:#fdeaea;
  --frame:#2b333d; --linegreen:#06c755;
  --chat-bg:#c7d7ea; --chat-meta:#34475f; --bubble:#ffffff; --bubble-me:#a6e893; --bubble-me-ink:#10240d;
  --dim:rgba(22,32,43,.55);
  --font-body:"Noto Sans TC",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;
  --font-num:"Space Grotesk","Noto Sans TC",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}

.app{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body.touring .app{padding-block-end:340px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px}
.brand{min-width:0;flex:1 1 260px}
.brand h1{margin:0;font-size:20px;font-weight:700;text-wrap:balance}
.brand p{margin:0;color:var(--muted);font-size:14px}
.clockbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:4px 8px;border-radius:12px}
.clock{display:flex;flex-direction:column;line-height:1.1}
.clock small{font-size:12px;color:var(--muted)}
.clock b{font-family:var(--font-num);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;line-height:1.3;min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ember);border-color:var(--ember);color:var(--on-ember);font-weight:700}
.btn.small{padding:6px 12px;font-size:14px;min-height:36px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.tourbtn{background:var(--ember-soft);border-color:var(--ember);color:var(--ember);font-weight:700}
.next{font-size:13px;color:var(--muted);flex-basis:100%}
.next b{color:var(--ink);font-weight:500}

/* view tabs (narrow screens only) */
.viewtabs{display:none}

/* stage */
.stage{display:grid;grid-template-columns:380px minmax(0,1fr);gap:28px;margin-top:20px;align-items:start}
.role{display:inline-flex;align-items:center;gap:8px;font-size:16px;font-weight:700;margin:0 0 10px}
.role i{font-style:normal;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px}
.role.c i{background:var(--cust-soft);color:var(--cust)}
.role.o i{background:var(--ember-soft);color:var(--ember)}
.role span{font-weight:400;color:var(--muted);font-size:14px}

/* phone */
.phone{width:100%;max-width:380px;height:740px;border-radius:40px;background:var(--frame);padding:10px;margin:0 auto;display:flex;box-shadow:0 18px 40px -22px rgba(0,0,0,.5)}
.screen{flex:1;min-width:0;min-height:0;border-radius:31px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column;font-size:15px}
.sbar{display:flex;justify-content:space-between;padding:9px 22px 3px;font-size:13px;font-weight:700;background:var(--surface)}
.lhead{display:flex;align-items:center;gap:10px;padding:8px 14px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.lhead .t{min-width:0;flex:1}
.lhead .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lhead .t span{font-size:12px;color:var(--muted)}
.lpill{background:var(--linegreen);color:#ffffff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px}
.av{width:34px;height:34px;border-radius:50%;background:var(--ember);color:var(--on-ember);display:grid;place-items:center;font-size:14px;font-weight:700;flex:none}
.scroll{flex:1;min-height:0;overflow-y:auto}
.cnav{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--surface)}
.cnav button{border:0;background:transparent;padding:12px 4px 14px;font-size:14px;color:var(--muted);position:relative}
.cnav button.on{color:var(--cust);font-weight:700}
.badge{position:absolute;top:5px;margin-left:2px;background:var(--bad);color:#ffffff;font-size:11px;font-weight:700;border-radius:999px;padding:0 6px;line-height:18px}

/* chat */
.chat{background:var(--chat-bg);min-height:100%;padding:14px 12px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:92%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bwrap{display:flex;flex-direction:column;gap:3px;min-width:0}
.msg.me .bwrap{align-items:flex-end}
.bubble{background:var(--bubble);color:var(--ink);border-radius:16px;padding:11px 13px;white-space:pre-line;overflow-wrap:anywhere}
.msg.me .bubble{background:var(--bubble-me);color:var(--bubble-me-ink)}
.meta{font-size:11px;color:var(--chat-meta)}
.bubble h4{margin:0 0 6px;font-size:16px}
.bact{display:flex;flex-direction:column;gap:6px;margin-top:10px;white-space:normal}
.bbtn{border:0;border-radius:10px;padding:11px;background:var(--surface-2);color:var(--ink);font-weight:500;font-size:15px}
.bbtn.go{background:var(--cust);color:#ffffff;font-weight:700}
.bbtn:disabled{opacity:.55;cursor:not-allowed}
.sched{display:flex;flex-direction:column;gap:8px;margin-top:8px;white-space:normal}
.srow{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.srow b{font-size:15px}
.srow small{color:var(--muted);font-size:12px}
.answer{margin-top:8px;font-size:14px;font-weight:700;white-space:normal;color:var(--cust)}

/* order screen */
.pad{padding:14px;display:flex;flex-direction:column;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 4px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.addr{font-size:13px;color:var(--muted);margin:0}
.blist{display:flex;flex-direction:column;gap:8px}
.batch{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 8px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;width:100%}
.batch .bn{font-weight:700;font-size:16px}
.batch .bt{font-family:var(--font-num);font-size:13px;color:var(--muted);margin-left:6px}
.batch .left{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.batch .left b{color:var(--ink);font-size:16px}
.batch.sel{border-color:var(--cust);box-shadow:0 0 0 3px var(--cust-soft)}
.batch.off{background:var(--surface-2)}
.meter{grid-column:1/-1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.batch.off .meter{background:var(--line)}
.meter i{display:block;height:100%;background:var(--ember)}
.meter.full i{background:var(--muted)}
.chip{display:inline-block;font-size:13px;font-weight:500;padding:2px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.ember{background:var(--ember-soft);color:var(--ember)}
.form{border:2px solid var(--cust);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.frow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.frow .lab{min-width:0;font-weight:500}
.frow .lab small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:18px}
.stepper span{min-width:24px;text-align:center;font-family:var(--font-num);font-weight:700;font-size:18px}
.bound{font-size:13px;color:var(--muted)}
.bound b{color:var(--ok)}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);padding-top:8px}
.total b{font-family:var(--font-num);font-size:22px}
.subbtn{background:var(--cust);border:0;color:#ffffff;font-weight:700;border-radius:12px;padding:13px;font-size:17px}
.notice{border-radius:12px;padding:12px 14px;font-size:15px}
.notice.bad{background:var(--bad-soft);color:var(--bad)}
.ocard{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.ocard .h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.ocard .h b{font-size:16px}
.ocard small{color:var(--muted);font-size:13px}
.ocard .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ocard select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:15px}
.hint{font-size:14px;color:var(--muted);margin:0}

/* owner console */
.console{background:var(--surface);border:1px solid var(--line);border-radius:18px;height:740px;display:flex;flex-direction:column;overflow:hidden;container-type:inline-size;box-shadow:0 18px 40px -30px rgba(0,0,0,.4)}
.ohead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ohead b{font-size:17px}
.ohead select{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 10px;max-width:100%}
.otabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);padding:0 8px;flex:none}
.otab{border:0;background:transparent;padding:12px 12px 10px;border-bottom:3px solid transparent;color:var(--muted);white-space:nowrap;font-size:15px}
.otab.on{border-color:var(--ember);color:var(--ember);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@container (min-width:560px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.stat small{display:block;font-size:13px;color:var(--muted)}
.stat b{font-family:var(--font-num);font-size:26px;font-variant-numeric:tabular-nums}
.stat b em{font-style:normal;font-size:13px;color:var(--muted);margin-left:3px}
.stat.alert{background:var(--bad-soft)}
.stat.alert b{color:var(--bad)}
.sec{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.sec h3{margin:0;font-size:16px}
.bcard{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 8px;align-items:center}
.bcard .cnt{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--muted)}
.bcard .cnt b{color:var(--ink);font-family:var(--font-num)}
.bcard .cnt .bad b{color:var(--bad)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--muted);font-weight:500;background:var(--surface-2)}
td.r,th.r{text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;background:var(--surface-2)}
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;white-space:nowrap}
.pill.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.orow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;padding:12px;border-bottom:1px solid var(--line);align-items:center}
.orow:last-child{border-bottom:0}
.orow.mine{background:var(--ember-soft)}
.orow .nm{font-weight:700}
.orow .youtag{font-size:12px;font-weight:700;background:var(--ember);color:var(--on-ember);border-radius:5px;padding:0 6px;margin-left:6px}
.orow small{grid-column:1/-1;color:var(--muted);font-size:13px}
.orow .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.olist{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:14px;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;width:100%}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.log li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.log time{font-family:var(--font-num);color:var(--muted);font-size:13px;padding-top:1px}
.muted{color:var(--muted)}

/* tour: spotlight + bottom card */
#spot{position:fixed;z-index:30;border-radius:16px;pointer-events:none;box-shadow:0 0 0 4px var(--ember),0 0 0 9999px var(--dim);transition:top .25s,left .25s,width .25s,height .25s}
#spot.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:no-preference){
  #spot::after{content:"";position:absolute;inset:-4px;border-radius:18px;border:4px solid var(--ember);animation:pulse 1.6s ease-out infinite}
}
@media (prefers-reduced-motion:reduce){#spot{transition:none}#spot.shake{animation:none}}
@keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.06)}}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(700px,calc(100% - 24px));background:var(--surface);border-radius:20px;box-shadow:0 24px 60px -12px rgba(0,0,0,.5);padding:18px 22px 20px;z-index:40;display:flex;flex-direction:column;gap:10px}
.sh-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sh-count{font-size:14px;color:var(--muted);font-weight:500}
.sh-close{border:0;background:transparent;color:var(--muted);font-size:14px;padding:6px 4px;text-decoration:underline}
.sh-bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.sh-bar i{display:block;height:100%;background:var(--ember)}
.sh-who{font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;align-self:flex-start}
.sh-who.c{background:var(--cust-soft);color:var(--cust)}
.sh-who.o{background:var(--ember-soft);color:var(--ember)}
.sh-who.t{background:var(--surface-2);color:var(--ink)}
.sheet h2{margin:0;font-size:23px;line-height:1.35;text-wrap:balance}
.sheet p{margin:0;font-size:18px;line-height:1.65;color:var(--ink);max-width:60ch}
.sh-btns{display:flex;gap:10px;margin-top:4px}
.bigbtn{min-height:56px;font-size:19px;padding:10px 18px;border-radius:14px;font-weight:700}
.sh-btns .back{flex:none;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:500}
.sh-btns .go{flex:1;background:var(--ember);border:0;color:var(--on-ember)}
.sh-btns button:disabled{opacity:.5;cursor:wait}
.sh-tip{font-size:14px;color:var(--muted);margin:0}

.modal{position:fixed;inset:0;z-index:50;background:var(--dim);display:grid;place-items:center;padding:16px}
.mcard{background:var(--surface);border-radius:22px;max-width:580px;width:100%;padding:28px;max-height:calc(100% - 16px);overflow:auto;display:flex;flex-direction:column;gap:16px;box-shadow:0 24px 60px -12px rgba(0,0,0,.5)}
.mcard h2{margin:0;font-size:28px;line-height:1.3;text-wrap:balance}
.mcard .lead{margin:0;font-size:18px;color:var(--muted)}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.mlist li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start;font-size:18px;line-height:1.5}
.mlist li span{width:40px;height:40px;border-radius:50%;background:var(--ember-soft);color:var(--ember);display:grid;place-items:center;font-family:var(--font-num);font-weight:700;font-size:18px}
.mlist li small{display:block;color:var(--muted);font-size:15px}
.mbtns{display:flex;flex-direction:column;gap:10px}
.mbtns .go{background:var(--ember);color:var(--on-ember);border:0}
.mbtns .alt{background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:500}
.mnote{font-size:14px;color:var(--muted);margin:0;text-align:center}

#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:12px;font-size:15px;z-index:60;max-width:calc(100% - 32px);box-shadow:0 8px 24px -8px rgba(0,0,0,.4)}

@media (max-width:860px){
  .viewtabs{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;background:var(--surface-2);border-radius:12px;padding:4px;margin-top:12px}
  .viewtabs button{border:0;background:transparent;border-radius:9px;padding:10px 4px;font-size:16px;color:var(--muted);position:relative}
  .viewtabs button.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .stage{grid-template-columns:minmax(0,1fr);margin-top:12px}
  .stage[data-view="cust"] .powner,.stage[data-view="owner"] .pcust{display:none}
  .phone{height:640px}
  .console{height:640px}
}
@media (max-width:600px){
  .brand p,.next{display:none}
  .top{position:static}
  .brand h1{font-size:17px}
  .clock b{font-size:24px}
  .top{gap:8px 12px}
  .sheet{padding:14px 16px 16px;width:calc(100% - 16px);bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .sheet h2{font-size:20px}
  .sheet p{font-size:16px}
  .bigbtn{min-height:52px;font-size:17px}
  .mcard{padding:22px}
  .mcard h2{font-size:23px}
  .mlist li{font-size:16px}
}
</style>

<div class="app">
  <header class="top" id="top"></header>
  <nav class="viewtabs" id="viewtabs" aria-label="切換畫面"></nav>
  <main class="stage" id="stage" data-view="cust">
    <section class="pcust" aria-label="客人的手機">
      <p class="role c"><i>客人</i>客人的手機 <span>（用平常的 LINE）</span></p>
      <div class="phone"><div class="screen" id="cust"></div></div>
    </section>
    <section class="powner" aria-label="老闆的後台">
      <p class="role o"><i>老闆</i>老闆的後台 <span>（手機、平板都能開）</span></p>
      <div class="console" id="owner"></div>
    </section>
  </main>
</div>
<div id="spot" hidden></div>
<div id="sheet" class="sheet" hidden role="dialog" aria-live="polite"></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" hidden></div>

<script>
(function(){
'use strict';
var STORE='大仁哥碳烤蔗香脆皮桶仔雞';
var PRICE={chicken:499,kimchi:200,essence:100};
var ME_NAME='示範客人', BAD_NAME='陳○豪';
var NAMES=['林○宏','黃○雯','張○豪','李○君','吳○廷','蔡○芬','周○安','鄭○琳','謝○翔','洪○如','邱○傑','賴○萱','徐○誠','何○儀','簡○達','葉○穎','方○宇','潘○慈','杜○恩','范○婷','宋○霖','高○璇','羅○成','石○瑜','戴○偉','孫○德','馬○蓉','朱○恆','胡○昀','郭○萍','曹○嘉','袁○豪','許○甄','鍾○翰','彭○妤','蕭○群','田○綸','董○晴','溫○川','傅○芸','沈○凱','韓○薇','唐○軒','馮○雅','程○廷','魏○璋','呂○蓁','蘇○男','丁○靜','游○哲','江○萱','余○仁','卓○妍','藍○安','柯○宸'];
var SESS={
  fri:{label:'11/27（五）三重',short:'11/27 三重',place:'三重 新寶月子中心',addr:'新北市三重區集賢路207號（新寶月子中心）',ended:true},
  sat:{label:'11/28（六）林口',short:'11/28 林口',place:'林口 立德公園對面',addr:'新北市林口區仁愛二路（立德公園對面）'},
  sun:{label:'11/29（日）內湖',short:'11/29 內湖',place:'內湖 義居雅舍',addr:'臺北市內湖區西康里內湖路一段203巷28號（義居雅舍）'}
};
var STATUS={pending:['待確認','warn'],confirmed:['已確認','ok'],picked:['已取餐',''],noshow:['棄單','bad'],cancelled:['已取消','']};

var S, seed, ni, toastTimer, lastChatLen=0;
var tour={on:false,i:0,snaps:[],busy:false};

function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}
function fmt(m){m=((m%1440)+1440)%1440;var h=Math.floor(m/60),mm=m%60;return (h<10?'0':'')+h+':'+(mm<10?'0':'')+mm;}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function getB(id){for(var i=0;i<S.batches.length;i++)if(S.batches[i].id===id)return S.batches[i];return null;}
function getO(id){id=Number(id);for(var i=0;i<S.orders.length;i++)if(S.orders[i].id===id)return S.orders[i];return null;}
function myOrder(bid){return S.orders.filter(function(o){return o.isMe&&o.batchId===bid&&o.status!=='cancelled';})[0];}
function batchesOf(s){return S.batches.filter(function(b){return b.s===s;});}
function ordersOf(bid){return S.orders.filter(function(o){return o.batchId===bid;});}
function used(b){return ordersOf(b.id).reduce(function(a,o){return a+(o.status==='cancelled'?0:o.qty);},0);}
function remaining(b){return Math.max(0,b.cap-used(b));}
function meName(){return S.identity==='blocked'?BAD_NAME:ME_NAME;}
function isBlocked(n){return (S.credits[n]||0)>=2&&!S.override[n];}
function orderable(b){return S.now<b.start-60;}
function credit(n){S.credits[n]=(S.credits[n]||0)+1;}
function addLog(t,kind,text){S.log.push({t:t,kind:kind,text:text});}
function items(o){var a=['雞 '+o.qty+' 隻'];if(o.kimchi)a.push('泡菜 '+o.kimchi+' 份');if(o.essence)a.push('滴雞精 '+o.essence+' 包');return a.join('・');}
function bState(b){
  var r=remaining(b);
  if(S.now<b.start-60)return r>0?['可預訂','ok']:['已額滿','warn'];
  if(S.now<b.start)return ['已截止・備料中',''];
  if(S.now<=b.end+10)return ['取餐中','ember'];
  return ['已結束',''];
}
function chip(p){return '<span class="chip '+p[1]+'">'+p[0]+'</span>';}

function fill(total,first){var a=first?[first]:[],s=first||0;while(s<total){var q=Math.min(total-s,1+Math.floor(rnd()*3));a.push(q);s+=q;}return a;}
function addSim(bid,qty,status,sim){
  var src=sim?'line':(rnd()<.15?'phone':'line');
  if(src==='phone'&&status==='pending')status='confirmed';
  var o={id:S.nextId++,batchId:bid,name:NAMES[ni++%NAMES.length],phone4:String(1000+Math.floor(rnd()*9000)),qty:qty,
    kimchi:rnd()<.3?1:0,essence:rnd()<.12?1:0,status:status,isMe:false,src:src,
    sim:Object.assign({r1:'confirm',r2:'confirm',come:true},sim||{})};
  S.orders.push(o);return o;
}
function pushChat(m){
  m.id=S.nextMsg++;m.time=fmt(S.now);S.chat.push(m);
  if(S.custScreen!=='chat')S.unread++;
  if(m.tag==='push'||m.type==='reminder'||m.type==='offer')S.newPush++;
  return m;
}

function init(){
  seed=7;ni=0;lastChatLen=0;
  S={now:880,identity:'normal',view:'cust',custScreen:'chat',orderSession:'sat',selBatch:null,form:{qty:1,kimchi:0,essence:0},
    ownerSession:'sat',ownerTab:'overview',listBatch:'b3',orders:[],chat:[],log:[],pushes:0,credits:{},override:{},
    offer:null,nextId:1,nextMsg:1,unread:0,newPush:0,po:{name:'',phone:'',batch:'b4',qty:1,kimchi:0},
    batches:(function(){
      var T=[['第一爐',720],['第二爐',795],['第三爐',870],['第四爐',945],['第五爐',1020],['第六爐',1100]],a=[];
      T.forEach(function(t,i){a.push({id:'b'+i,s:'sat',name:t[0],start:t[1],end:t[1]+20,cap:20,waitlist:[]});});
      T.forEach(function(t,i){a.push({id:'s'+(i+1),s:'sun',name:t[0],start:t[1]+1440,end:t[1]+1460,cap:20,waitlist:[]});});
      return a;
    })()
  };
  var q,n,first;
  function lineCount(id){return ordersOf(id).filter(function(o){return o.src==='line';}).length;}
  q=fill(20);q.forEach(function(x,i){var last=i===q.length-1;var o=addSim('b0',x,last?'noshow':'picked');if(last){credit(o.name);first=o;}});
  fill(18).forEach(function(x){addSim('b1',x,'picked');});
  q=fill(14);n=q.length;q.forEach(function(x,i){
    if(i===n-1)addSim('b2',x,'confirmed',{come:false});
    else if(i===n-2)addSim('b2',x,'pending',{r1:'none',r2:'none',come:false});
    else addSim('b2',x,'picked');
  });
  q=fill(12);q.forEach(function(x,i){addSim('b3',x,'pending',i===1?{r1:'none',r2:'confirm'}:i===2?{r1:'none',r2:'none',come:false}:null);});
  q=fill(20,2);q.forEach(function(x,i){addSim('b4',x,'pending',i===0?{r1:'cancel'}:i===3?{r1:'none',r2:'none',come:false}:i===5?{come:false}:null);});
  q=fill(7);q.forEach(function(x,i){addSim('b5',x,'pending',i===1?{r1:'none',r2:'confirm'}:null);});
  ['s1','s2','s3','s4','s5','s6'].forEach(function(id){fill(3+Math.floor(rnd()*7)).forEach(function(x){addSim(id,x,'pending');});});
  S.credits[BAD_NAME]=2;S.credits['王○傑']=1;
  var l0=lineCount('b0'),l1=lineCount('b1'),l2=lineCount('b2');
  S.pushes=l0+l1+l2+7;
  addLog(660,'remind','第一爐 取餐提醒：傳了 '+l0+' 則 LINE，線上預訂截止');
  addLog(735,'remind','第二爐 取餐提醒：傳了 '+l1+' 則 LINE，線上預訂截止');
  addLog(750,'noshow','第一爐 時間到沒來拿：1 筆（'+first.name+' '+first.qty+' 隻）→ 讓給現場客人');
  addLog(810,'remind','第三爐 取餐提醒：傳了 '+l2+' 則 LINE，線上預訂截止');
  addLog(825,'pick','第二爐 全部拿走了，沒有棄單');
  addLog(855,'remind','第三爐 第二次提醒：傳了 4 則（只傳給還沒確認的人）');
  addLog(875,'pick','第三爐 開始取餐');
  S.chat.push({id:S.nextMsg++,type:'text',from:'store',tag:'push',time:'11/19 20:00',text:'嗨！直接點下面的場次就能預訂。\n取餐前 1 小時會用 LINE 提醒你，按一下「確認會到」就好。'});
  S.chat.push({id:S.nextMsg++,type:'schedule',from:'store',tag:'push',time:'11/19 20:00'});
}

/* ---------- simulation ---------- */
function tick(m){
  S.batches.forEach(function(b){
    if(b.s!=='sat')return;
    var os=ordersOf(b.id),n=0;
    if(m===b.start-60){
      os.forEach(function(o){
        if(o.status!=='pending'||o.src!=='line')return;n++;
        if(o.isMe)pushChat({type:'reminder',orderId:o.id,round:1,from:'store'});
        else if(o.sim.r1==='confirm')o.status='confirmed';
        else if(o.sim.r1==='cancel'){o.status='cancelled';addLog(m,'cancel',o.name+' 收到提醒後取消 '+b.name+' '+o.qty+' 隻');release(b,o.qty,m);}
      });
      S.pushes+=n;addLog(m,'remind',b.name+' 取餐提醒：傳了 '+n+' 則 LINE，線上預訂截止');
    }
    if(m===b.start-15){
      os.forEach(function(o){
        if(o.status!=='pending'||o.src!=='line')return;n++;
        if(o.isMe)pushChat({type:'reminder',orderId:o.id,round:2,from:'store'});
        else if(o.sim.r2==='confirm')o.status='confirmed';
      });
      if(n){S.pushes+=n;addLog(m,'remind',b.name+' 第二次提醒：傳了 '+n+' 則（只傳給還沒確認的人）');}
    }
    if(m===b.start+5){
      var q=0;
      os.forEach(function(o){if(!o.isMe&&o.sim&&o.sim.come&&(o.status==='pending'||o.status==='confirmed')){o.status='picked';q+=o.qty;}});
      addLog(m,'pick',b.name+' 開始取餐'+(q?'：已拿走 '+q+' 隻':''));
    }
    if(m===b.end+10){
      var ns=os.filter(function(o){return o.status==='pending'||o.status==='confirmed';}),tq=0;
      ns.forEach(function(o){
        o.status='noshow';tq+=o.qty;credit(o.name);
        if(o.isMe){pushChat({type:'text',from:'store',tag:'push',text:'你預訂的 '+b.name+'（'+o.qty+' 隻）已經過了取餐時間，系統記為沒來拿。\n累計 2 次會暫停 LINE 預訂，改用電話或現場購買。'});S.pushes++;}
      });
      if(ns.length)addLog(m,'noshow',b.name+' 時間到沒來拿：'+ns.length+' 筆共 '+tq+' 隻 → 讓給現場客人');
      else addLog(m,'pick',b.name+' 全部拿走了，沒有棄單');
    }
  });
  if(S.offer&&S.offer.expires===m){
    S.chat.forEach(function(x){if(x.id===S.offer.msgId)x.answered='expired';});
    addLog(m,'wait','候補通知 10 分鐘沒回覆，名額讓給現場');S.offer=null;
  }
}
function release(b,qty,m){
  var w=b.waitlist.shift();
  if(!w){addLog(m,'wait',b.name+' 空出 '+qty+' 隻'+(m<b.start-60?'，回到 LINE 上可以訂':'，讓給現場客人'));return;}
  var give=Math.min(w.qty,qty);
  if(w.isMe){
    var msg=pushChat({type:'offer',from:'store',batchId:b.id,qty:give,expires:m+10});
    S.offer={msgId:msg.id,batchId:b.id,qty:give,expires:m+10,name:w.name};
    S.pushes++;
    addLog(m,'wait',b.name+' 空出 '+qty+' 隻 → 通知候補第 1 位（'+w.name+'），10 分鐘內回覆');
  }else{
    S.orders.push({id:S.nextId++,batchId:b.id,name:w.name,phone4:'0000',qty:give,kimchi:0,essence:0,status:'confirmed',isMe:false,src:'line',sim:{come:true}});
    addLog(m,'wait',b.name+' 空出 '+qty+' 隻 → 候補 '+w.name+' 補上');
  }
}
function upcoming(){
  var ev=[];
  batchesOf('sat').forEach(function(b){
    [[b.start-60,'取餐提醒'],[b.start-15,'第二次提醒'],[b.start+5,'開始取餐'],[b.end+10,'判定沒來拿的']].forEach(function(p){
      if(p[0]>S.now&&p[0]<=1439)ev.push({t:p[0],l:b.name+' '+p[1]});
    });
  });
  if(S.offer&&S.offer.expires>S.now)ev.push({t:S.offer.expires,l:'候補通知到期'});
  ev.sort(function(a,b){return a.t-b.t;});
  return ev;
}
function advance(to){
  to=Math.min(to,1439);S.newPush=0;
  for(var m=S.now+1;m<=to;m++){S.now=m;tick(m);}
  S.now=to;
  if(S.newPush&&!tour.on)toast('客人的手機收到 '+S.newPush+' 則新的 LINE 通知');
}

/* ---------- render: top ---------- */
function renderTop(){
  var ev=upcoming(),nx=ev[0];
  var same=nx?ev.filter(function(e){return e.t===nx.t;}).map(function(e){return e.l;}).join('、'):'';
  document.getElementById('top').innerHTML=
    '<div class="brand"><h1>桶仔雞預訂系統・示範</h1><p>資料都是假的，隨便按不會壞。</p></div>'+
    '<div class="clockbox" id="clockbox">'+
      '<div class="clock"><small>示範時鐘・'+SESS.sat.label+'</small><b>'+fmt(S.now)+'</b></div>'+
      '<button class="btn" data-act="time" data-v="30"'+(S.now>=1439?' disabled':'')+'>快轉 30 分</button>'+
      '<button class="btn primary" data-act="next"'+(nx?'':' disabled')+'>快轉到下一件事 ▸</button>'+
      '<span class="next">'+(nx?'下一件事：<b class="num">'+fmt(nx.t)+'</b> <b>'+esc(same)+'</b>':'今天的事都跑完了')+'</span>'+
    '</div>'+
    (tour.on?'':'<button class="btn tourbtn" data-tour="start">▶ 從頭看導覽</button>');
}
function renderViewTabs(){
  var t=[['cust','客人的手機'],['owner','老闆的後台']];
  document.getElementById('viewtabs').innerHTML=t.map(function(x){
    var b=(x[0]==='cust'&&S.unread&&S.view!=='cust')?'<span class="badge">'+S.unread+'</span>':'';
    return '<button data-act="view" data-v="'+x[0]+'" class="'+(S.view===x[0]?'on':'')+'">'+x[1]+b+'</button>';
  }).join('');
  document.getElementById('stage').setAttribute('data-view',S.view);
}

/* ---------- render: customer ---------- */
function renderCust(){
  var body='';
  if(S.custScreen==='chat'){S.unread=0;body=chatView();}
  else if(S.custScreen==='order')body=orderView();
  else body=mineView();
  var nav=[['chat','聊天'],['order','訂購'],['mine','我的訂單']].map(function(x){
    var b=(x[0]==='chat'&&S.unread)?'<span class="badge">'+S.unread+'</span>':'';
    return '<button data-act="cust" data-v="'+x[0]+'" class="'+(S.custScreen===x[0]?'on':'')+'">'+x[1]+b+'</button>';
  }).join('');
  document.getElementById('cust').innerHTML='<div class="sbar"><span class="num">'+fmt(S.now)+'</span><span>5G ▮▮▮</span></div>'+
    '<div class="lhead"><span class="av">雞</span><span class="t"><b>'+STORE+'</b><span>LINE 官方帳號（示範畫面）</span></span><span class="lpill">LINE</span></div>'+
    '<div class="scroll" data-scroll="cust-'+S.custScreen+'">'+body+'</div><nav class="cnav">'+nav+'</nav>';
}
function storeMsg(inner,m,key){
  var tag=m.tag==='reply'?'回覆訊息・免費':'主動通知・算在 LINE 方案則數';
  return '<div class="msg"'+(key?' data-msg="'+key+'"':'')+'><span class="av">雞</span><div class="bwrap"><div class="bubble">'+inner+'</div><span class="meta">'+esc(m.time)+'・'+tag+'</span></div></div>';
}
function chatView(){
  return '<div class="chat">'+S.chat.map(function(m){
    if(m.type==='schedule'){
      var rows=['fri','sat','sun'].map(function(k){
        var s=SESS[k];
        return '<div class="srow"><b>'+s.label+'</b><small>'+s.addr+'</small>'+
          (s.ended?'<button class="bbtn" disabled>已結束</button>':'<button class="bbtn go" data-act="open-order" data-v="'+k+'">立即預訂</button>')+'</div>';
      }).join('');
      return storeMsg('<h4>本週巡迴行程</h4>脆皮雞全雞 $499・黃金泡菜 500g $200・滴雞精 1 包 $100<div class="sched">'+rows+'</div>',m,'schedule');
    }
    if(m.type==='text'){
      if(m.from==='me')return '<div class="msg me"><div class="bwrap"><div class="bubble">'+esc(m.text)+'</div><span class="meta">'+m.time+'</span></div></div>';
      return storeMsg(esc(m.text),m);
    }
    if(m.type==='reminder'){
      var o=getO(m.orderId),b=getB(o.batchId),foot;
      if(o.status==='pending')foot='<div class="bact"><button class="bbtn go" data-act="r-confirm" data-v="'+o.id+'">確認會到</button><button class="bbtn" data-act="my-cancel" data-v="'+o.id+'">不能來，取消訂單</button></div>';
      else foot='<div class="answer">'+({confirmed:'✓ 已確認，等你來拿',cancelled:'已取消，名額讓給別人了',picked:'✓ 已取餐，謝謝光臨',noshow:'時間過了沒來拿'})[o.status]+'</div>';
      return storeMsg('<h4>'+(m.round===1?'⏰ 取餐提醒':'⏰ 再提醒一次：還沒收到你的確認')+'</h4>'+b.name+'　'+fmt(b.start)+'–'+fmt(b.end)+'\n'+SESS[b.s].place+'\n'+items(o)+'\n\n會準時來拿嗎？請按下面的按鈕。'+foot,{time:m.time,tag:'push'},'reminder');
    }
    if(m.type==='offer'){
      var bb=getB(m.batchId),f;
      if(m.answered==='accepted')f='<div class="answer">✓ 名額保留給你了</div>';
      else if(m.answered==='expired')f='<div class="answer">超過 10 分鐘，名額讓給現場客人了</div>';
      else f='<div class="bact"><button class="bbtn go" data-act="offer-accept">我要這 '+m.qty+' 隻</button></div>';
      return storeMsg('<h4>🔔 候補通知</h4>'+bb.name+' 有人取消，空出 '+m.qty+' 隻。\n請在 '+fmt(m.expires)+' 前按下面的按鈕，超過就讓給下一位。'+f,{time:m.time,tag:'push'},'offer');
    }
    return '';
  }).join('')+'</div>';
}
function orderView(){
  var sk=S.orderSession,sess=SESS[sk],name=meName();
  var h='<div class="pad"><div class="seg">'+['sat','sun'].map(function(k){
    return '<button data-act="osess" data-v="'+k+'" class="'+(sk===k?'on':'')+'">'+SESS[k].short+'</button>';
  }).join('')+'</div><p class="addr">📍 '+sess.addr+'</p>';
  if(isBlocked(name)){
    return h+'<div class="notice bad"><b>暫停 LINE 預訂</b><br>你已經有 '+S.credits[name]+' 次訂了沒來拿，系統暫停你的 LINE 預訂。<br>還是可以打電話預訂，或到攤位現場買。</div>'+
      '<button class="btn small" data-act="identity" data-v="normal">切回一般客人</button></div>';
  }
  h+='<div class="blist">'+batchesOf(sk).map(function(b){
    var r=remaining(b),st=bState(b),pct=Math.round(used(b)/b.cap*100),can=orderable(b)&&r>0;
    var waiting=b.waitlist.some(function(w){return w.isMe;}),tail='';
    if(orderable(b)&&r===0)tail=waiting?'<span class="chip ember">你在候補名單上</span>':'<button class="btn small" data-act="join-wait" data-v="'+b.id+'">排候補</button>';
    var inner='<span><span class="bn">'+b.name+'</span><span class="bt">'+fmt(b.start)+'–'+fmt(b.end)+'</span></span>'+chip(st)+
      '<span class="meter'+(r===0?' full':'')+'"><i style="width:'+pct+'%"></i></span>'+
      '<span class="left"><span>'+(r>0?'還剩 <b class="num">'+r+'</b> 隻':'全部 '+b.cap+' 隻都訂完了')+'</span>'+tail+'</span>';
    if(can)return '<button class="batch'+(S.selBatch===b.id?' sel':'')+'" data-act="pick-batch" data-v="'+b.id+'">'+inner+'</button>';
    return '<div class="batch off" data-bid="'+b.id+'">'+inner+'</div>';
  }).join('')+'</div>';
  var b=getB(S.selBatch);
  if(b&&b.s===sk&&orderable(b)){
    var f=S.form,max=Math.min(5,remaining(b)),tot=f.qty*PRICE.chicken+f.kimchi*PRICE.kimchi+f.essence*PRICE.essence;

/* ---------- actions ---------- */
function cancelOrder(o){
  var b=getB(o.batchId);
  if(S.now>=b.start){toast('已經開始取餐，不能取消了');return;}
  o.status='cancelled';
  addLog(S.now,'cancel',o.name+' 自己取消 '+b.name+' '+o.qty+' 隻');
  pushChat({type:'text',from:'store',tag:'reply',text:'已取消 '+b.name+' '+o.qty+' 隻。謝謝你提早說！'});
  S.newPush=0;release(b,o.qty,S.now);
  toast('已取消，名額自動空出來');
}
function act(a,v,f){
  var o,b;
  switch(a){
    case 'time':advance(S.now+Number(v));break;
    case 'next':var ev=upcoming();if(ev.length)advance(ev[0].t);break;
    case 'view':S.view=v;break;
    case 'cust':S.custScreen=v;break;
    case 'identity':S.identity=v;S.selBatch=null;if(v==='blocked'){S.custScreen='order';S.orderSession='sat';S.view='cust';}toast(v==='blocked'?'現在是「'+BAD_NAME+'」的手機畫面':'切回一般客人');break;
    case 'open-order':S.custScreen='order';S.orderSession=v;S.selBatch=null;
      S.chat.push({id:S.nextMsg++,type:'text',from:'me',time:fmt(S.now),text:'預訂 '+SESS[v].short});break;
    case 'osess':S.orderSession=v;S.selBatch=null;break;
    case 'pick-batch':S.selBatch=v;S.form={qty:1,kimchi:0,essence:0};break;
    case 'step':
      var sb=getB(S.selBatch);if(!sb)break;
      var cur=S.form[f]+Number(v),mx=f==='qty'?Math.min(5,remaining(sb)):5,mn=f==='qty'?1:0;
      S.form[f]=Math.max(mn,Math.min(mx,cur));break;
    case 'submit':
      b=getB(S.selBatch);var nm=meName();
      if(!b||!orderable(b)){toast('這爐已經截止，請選別爐');break;}
      if(isBlocked(nm)){toast('這個帳號已暫停 LINE 預訂');break;}
      if(S.form.qty>remaining(b)){toast('這爐只剩 '+remaining(b)+' 隻');break;}
      o={id:S.nextId++,batchId:b.id,name:nm,phone4:'5678',qty:S.form.qty,kimchi:S.form.kimchi,essence:S.form.essence,status:'pending',isMe:true,src:'line'};
      S.orders.push(o);
      pushChat({type:'text',from:'store',tag:'reply',text:'✅ 預訂成功\n'+SESS[b.s].label+'\n'+b.name+' '+fmt(b.start)+'–'+fmt(b.end)+'\n'+items(o)+'\n\n取餐前 1 小時會傳 LINE 提醒你。'});
      addLog(S.now,'order',nm+' 用 LINE 訂了 '+b.name+' '+o.qty+' 隻');
      S.selBatch=null;S.custScreen='mine';if(!tour.on)toast('訂好了！老闆後台的數字也同時更新');break;
    case 'join-wait':
      b=getB(v);if(isBlocked(meName())){toast('這個帳號已暫停 LINE 預訂');break;}
      b.waitlist.push({isMe:true,qty:Math.max(1,S.form.qty||1),name:meName()});
      pushChat({type:'text',from:'store',tag:'reply',text:'已幫你排進 '+b.name+' 候補第 '+b.waitlist.length+' 位。有人取消會馬上通知你。'});
      addLog(S.now,'wait',meName()+' 排進 '+b.name+' 候補');if(!tour.on)toast('已排進候補');break;
    case 'r-confirm':
      o=getO(v);
      if(o&&o.status==='pending'){o.status='confirmed';addLog(S.now,'remind',o.name+' 回覆會準時來拿（'+getB(o.batchId).name+'）');
        S.chat.push({id:S.nextMsg++,type:'text',from:'me',time:fmt(S.now),text:'確認會到'});}
      break;
    case 'my-cancel':o=getO(v);if(o&&(o.status==='pending'||o.status==='confirmed'))cancelOrder(o);break;
    case 'my-change':
      o=getO(v);var sel=document.getElementById('chg-'+v);
      if(o&&sel){var to=getB(sel.value),from=getB(o.batchId);
        if(!orderable(to)||remaining(to)<o.qty){toast('那一爐名額不夠');break;}
        o.batchId=to.id;addLog(S.now,'order',o.name+' 自己改爐：'+from.name+' → '+to.name);
        pushChat({type:'text',from:'store',tag:'reply',text:'已改到 '+to.name+' '+fmt(to.start)+'–'+fmt(to.end)+'。'});toast('改好了，'+from.name+' 的名額自動空出來');}
      break;
    case 'offer-accept':
      if(!S.offer){toast('這個名額已經過期了');break;}
      var of=S.offer;b=getB(of.batchId);
      S.orders.push({id:S.nextId++,batchId:b.id,name:of.name,phone4:'5678',qty:of.qty,kimchi:0,essence:0,status:'confirmed',isMe:true,src:'line'});
      S.chat.forEach(function(m){if(m.id===of.msgId)m.answered='accepted';});
      S.offer=null;addLog(S.now,'wait',of.name+' 接受候補，拿到 '+b.name+' '+of.qty+' 隻');if(!tour.on)toast('候補成功！');break;
    case 'otab':S.ownerTab=v;break;
    case 'lbatch':S.listBatch=v;break;
    case 'o-pick':
      o=getO(v);if(o){o.status='picked';addLog(S.now,'pick',o.name+' 拿走了（'+getB(o.batchId).name+' '+o.qty+' 隻）');if(!tour.on)toast('已記錄取餐');}
      break;
    case 'o-noshow':
      o=getO(v);if(o){o.status='noshow';credit(o.name);addLog(S.now,'noshow','老闆記錄沒來拿：'+o.name+'（'+getB(o.batchId).name+' '+o.qty+' 隻）');toast('已記錄，這位客人沒來拿的次數 +1');}
      break;
    case 'add-batch':
      var bs=batchesOf(S.ownerSession),last=bs.reduce(function(a,x){return Math.max(a,x.start);},0),st=last+60;
      if(st%1440>1380){toast('時間太晚了，不能再加開');break;}
      var k=bs.filter(function(x){return x.name.indexOf('加開')===0;}).length+1;
      var nb={id:'x'+S.nextId++,s:S.ownerSession,name:'加開爐 '+k,start:st,end:st+20,cap:10,waitlist:[]};
      S.batches.push(nb);addLog(S.now,'order','老闆加開 '+nb.name+' '+fmt(nb.start)+'–'+fmt(nb.end)+'，10 隻');
      toast('加開好了，客人手機上馬上看得到');break;
    case 'po-submit':
      var p=S.po;b=getB(p.batch);var qn=parseInt(p.qty,10)||0,kn=parseInt(p.kimchi,10)||0;
      var digits=String(p.phone).replace(/\D/g,'');
      if(!p.name.trim()){toast('請填客人稱呼');break;}
      if(digits.length<8){toast('請填完整手機號碼，沒來拿時才找得到人');break;}
      if(!b){toast('請選哪一爐');break;}
      if(qn<1){toast('雞至少 1 隻');break;}
      if(qn>remaining(b)){toast('這爐只剩 '+remaining(b)+' 隻');break;}
      S.orders.push({id:S.nextId++,batchId:b.id,name:p.name.trim(),phone4:digits.slice(-4),qty:qn,kimchi:Math.max(0,kn),essence:0,status:'confirmed',isMe:false,src:'phone',sim:{come:true}});
      addLog(S.now,'order','電話訂的：'+p.name.trim()+' '+b.name+' '+qn+' 隻');
      S.po={name:'',phone:'',batch:p.batch,qty:1,kimchi:0};toast('訂好了，名額已扣');break;
    case 'unblock':S.override[v]=true;addLog(S.now,'system','老闆解除 '+v+' 的暫停');toast('已解除，這位客人可以再用 LINE 訂');break;
  }
}

  {who:'c',target:'#cust [data-msg="schedule"] .srow:nth-child(2)',click:'#cust [data-act="open-order"][data-v="sat"]',title:'客人點「立即預訂」',
   text:'你每週發的巡迴行程，客人在 LINE 裡點這個綠色按鈕就能訂。不用再留言「第二爐+1」，老闆也不用一則一則按讚確認。',cta:'幫我按「立即預訂」',
   prep:function(){S.custScreen='chat';},run:function(){act('open-order','sat');},done:function(){return S.custScreen==='order';}},
  {who:'c',target:'#cust .blist',click:'#cust [data-act="pick-batch"][data-v="b3"]',title:'每一爐還剩幾隻，一看就知道',
   text:'橘色條是已經訂掉的。第五爐滿了就訂不了，不用再改貼文寫「已額滿」。我們幫客人選第四爐。',cta:'幫我選「第四爐」',
   prep:function(){S.custScreen='order';S.orderSession='sat';S.selBatch=null;},run:function(){act('pick-batch','b3');},done:function(){return S.selBatch==='b3';}},
  {who:'c',target:'#cust .form',click:'#cust .form',title:'選好數量，按「送出預訂」',
   text:'客人選 2 隻雞、1 份泡菜。手機號碼第一次訂就綁好了，下次不用再填。',cta:'幫我選好並送出',
   prep:function(){S.custScreen='order';S.orderSession='sat';if(S.selBatch!=='b3'){S.selBatch='b3';S.form={qty:1,kimchi:0,essence:0};}},
   run:function(){S.form={qty:2,kimchi:1,essence:0};act('submit');},done:function(){return !!myOrder('b3');}},
  {who:'o',target:'#owner .bcard[data-bid="b3"]',title:'老闆這邊，馬上就看到了',
   text:'第四爐自動多了這 2 隻。往下還有「要準備多少」，雞、泡菜、滴雞精各要幾份，系統自動算好。',cta:'知道了，繼續',
   prep:function(){S.ownerTab='overview';S.ownerSession='sat';}},
  {who:'c',target:'#cust [data-bid="b4"]',click:'#cust [data-act="join-wait"][data-v="b4"]',title:'第五爐滿了？可以排候補',
   text:'有人取消的時候，系統會自動用 LINE 通知排候補的客人，雞不會浪費。',cta:'幫我按「排候補」',
   prep:function(){S.custScreen='order';S.orderSession='sat';S.form.qty=2;},run:function(){act('join-wait','b4');},
   done:function(){return getB('b4').waitlist.some(function(w){return w.isMe;});}},
  {who:'t',target:'#clockbox',title:'把時間快轉到下午 2:45',
   text:'上面是示範用的時鐘。2:45 是第四爐取餐前 1 小時，系統會自動傳 LINE 提醒客人。',cta:'快轉到 14:45',
   run:function(){advance(885);},done:function(){return S.now>=885;}},
  {who:'c',target:'#cust [data-msg="reminder"]',click:'#cust [data-msg="reminder"] [data-act="r-confirm"]',title:'客人收到提醒，按「確認會到」',
   text:'老闆不用一個一個打電話。沒按確認的，取餐前 15 分鐘系統會再提醒一次。',cta:'幫我按「確認會到」',
   prep:function(){S.custScreen='chat';},run:function(){var o=myOrder('b3');if(o)act('r-confirm',o.id);},
   done:function(){var o=myOrder('b3');return o&&o.status!=='pending';}},
  {who:'o',target:'#owner .orow.mine',click:'#owner .orow.mine [data-act="o-pick"]',title:'客人來拿了，按「已取餐」',
   text:'取餐名單照爐次排好，不用再翻留言對名字。這筆已經是「已確認」，客人來了按一下就好。',cta:'幫我按「已取餐」',
   prep:function(){S.ownerTab='list';S.ownerSession='sat';S.listBatch='b3';},run:function(){var o=myOrder('b3');if(o)act('o-pick',o.id);},
   done:function(){var o=myOrder('b3');return o&&o.status==='picked';}},
  {who:'t',target:'#clockbox',title:'快轉到下午 4:00，有人取消了',
   text:'4:00 是第五爐取餐前 1 小時。有一位客人收到提醒後按了「不能來」，空出 2 隻。',cta:'快轉到 16:00',
   run:function(){advance(960);},done:function(){return S.now>=960;}},
  {who:'c',target:'#cust [data-msg="offer"]',click:'#cust [data-msg="offer"] [data-act="offer-accept"]',title:'排候補的客人馬上收到通知',
   text:'他在 10 分鐘內按「我要」，名額就是他的。老闆什麼都不用做。',cta:'幫我按「我要」',
   prep:function(){S.custScreen='chat';},run:function(){act('offer-accept');},done:function(){return !!myOrder('b4');}},
  {who:'t',target:'#clockbox',title:'快轉到下午 5:30',
   text:'第五爐 5:00 到 5:20 取餐（每爐 20 分鐘）。過了 5:30 還沒來拿的，系統自動算棄單，名額讓給現場候補的客人。',cta:'快轉到 17:30',
   run:function(){var o=myOrder('b4');if(o&&(o.status==='pending'||o.status==='confirmed'))o.status='picked';advance(1050);},done:function(){return S.now>=1050;}},
  {who:'o',target:'#owner .bcard[data-bid="b4"]',title:'沒來拿的，系統自動處理',
   text:function(){var x=bNoShow('b4');return '第五爐有 '+x.n+' 筆沒來拿，共 '+x.q+' 隻。系統已經算好，名額讓給現場客人，你不用在攤位一直等。';},cta:'繼續',
   prep:function(){S.ownerTab='overview';S.ownerSession='sat';}},
  {who:'o',target:'#creditlist',title:'誰常常不來拿，系統記得',
   text:'第 1 次只提醒，滿 2 次自動暫停 LINE 預訂。不用老闆出面當壞人。',cta:'繼續',
   prep:function(){S.ownerTab='credit';}},
  {who:'c',target:'#cust .notice',title:'被暫停的客人，手機上看到這個',
   text:'他還是可以打電話或來現場買。如果是熟客想給他機會，老闆在後台按「放他一馬」就好。',cta:'看完了',
   prep:function(){S.identity='blocked';S.custScreen='order';S.orderSession='sat';S.selBatch=null;}}
];
var WHO={c:'客人的手機',o:'老闆的後台',t:'示範時鐘'};

function startTour(){
  init();tour.on=true;tour.i=0;tour.snaps=[];tour.busy=false;
  document.getElementById('modal').hidden=true;document.body.classList.add('touring');
  enterStep();
}
function enterStep(){
  var st=TOUR[tour.i];
  tour.snaps[tour.i]=JSON.stringify(S);
  if(st.prep)st.prep();
  if(st.who==='c'||st.who==='o')S.view=st.who==='c'?'cust':'owner';
  render();
  setTimeout(function(){
    var el=document.querySelector(st.target);
    if(el){
      var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      el.scrollIntoView({block:'center'});
      var sh=document.getElementById('sheet').getBoundingClientRect(),r=el.getBoundingClientRect();
      var room=sh.top-16,want=Math.max(12,(room-r.height)/2);
      window.scrollBy({top:r.top-want,behavior:reduce?'auto':'smooth'});
    }
    placeSpot();
  },30);
}
function finishStep(){
  tour.busy=true;renderTour();placeSpot();
  setTimeout(function(){
    tour.busy=false;
    if(tour.i>=TOUR.length-1){endTour(true);return;}
    tour.i++;enterStep();
  },1100);
}
function tourNext(){
  if(tour.busy)return;
  var st=TOUR[tour.i];
  if(st.run&&!(st.done&&st.done())){st.run();render();finishStep();}
  else{if(tour.i>=TOUR.length-1){endTour(true);return;}tour.i++;enterStep();}
}
function tourBack(){
  if(tour.busy||tour.i===0)return;
  tour.i--;S=JSON.parse(tour.snaps[tour.i]);lastChatLen=-1;enterStep();
}
function endTour(done){
  tour.on=false;tour.busy=false;document.body.classList.remove('touring');
  document.getElementById('spot').hidden=true;
  if(done)showModal('end');else{render();toast('導覽結束了，可以自己隨便點');}
}
function renderTour(){
  var sh=document.getElementById('sheet');
  if(!tour.on){sh.hidden=true;return;}
  var st=TOUR[tour.i],txt=typeof st.text==='function'?st.text():st.text,pct=Math.round((tour.i+1)/TOUR.length*100);
  sh.hidden=false;
  sh.innerHTML='<div class="sh-top"><span class="sh-count">第 <b class="num">'+(tour.i+1)+'</b> 步，共 '+TOUR.length+' 步</span><button class="sh-close" data-tour="close">結束導覽</button></div>'+
    '<div class="sh-bar"><i style="width:'+pct+'%"></i></div>'+
    '<span class="sh-who '+st.who+'">'+WHO[st.who]+'</span>'+
    '<h2>'+st.title+'</h2><p>'+txt+'</p>'+
    '<div class="sh-btns"><button class="bigbtn back" data-tour="back"'+(tour.i===0||tour.busy?' disabled':'')+'>◀ 上一步</button>'+
    '<button class="bigbtn go" data-tour="next"'+(tour.busy?' disabled':'')+'>'+(tour.busy?'好了！':st.cta+' ▶')+'</button></div>'+
    (st.click&&!tour.busy?'<p class="sh-tip">也可以直接點畫面上框起來的地方。</p>':'');
}
function placeSpot(){
  var sp=document.getElementById('spot');
  if(!tour.on){sp.hidden=true;return;}
  var el=document.querySelector(TOUR[tour.i].target);
  if(!el){sp.hidden=true;return;}
  var r=el.getBoundingClientRect(),top=r.top,bot=r.bottom,left=r.left,right=r.right;
  var sc=el.closest('.scroll');
  if(sc){var c=sc.getBoundingClientRect();top=Math.max(top,c.top);bot=Math.min(bot,c.bottom);}
  var p=8;sp.hidden=false;
  sp.style.top=(top-p)+'px';sp.style.left=(left-p)+'px';
  sp.style.width=(right-left+p*2)+'px';sp.style.height=Math.max(0,bot-top+p*2)+'px';
}
function nudge(){
  var sp=document.getElementById('spot');sp.classList.remove('shake');void sp.offsetWidth;sp.classList.add('shake');
  toast('請點框起來的地方，或下面的橘色大按鈕');
}
function showModal(kind){
  var m=document.getElementById('modal');m.hidden=false;
  if(kind==='welcome'){
    m.innerHTML='<div class="mcard" role="dialog" aria-labelledby="mt"><h2 id="mt">「訂了不來拿」的煩惱，交給系統</h2>'+
      '<p class="lead">這是示範畫面，資料都是假的，隨便按不會壞。</p>'+
      '<ol class="mlist"><li><span>1</span><div>客人用 LINE 訂，每一爐剩幾隻自動算<small>不用再數留言、改貼文</small></div></li>'+
      '<li><span>2</span><div>取餐前 1 小時，自動傳 LINE 提醒<small>客人按「確認會到」，沒回再提醒一次</small></div></li>'+
      '<li><span>3</span><div>時間到沒來拿，自動讓給現場客人<small>滿 2 次的客人，自動暫停 LINE 預訂</small></div></li></ol>'+
      '<div class="mbtns"><button class="bigbtn go" data-tour="start">▶ 開始導覽（大約 3 分鐘）</button>'+
      '<button class="bigbtn alt" data-tour="free">我想自己點點看</button></div>'+
      '<p class="mnote">導覽中每一步都有大按鈕幫你按，跟著看就好。</p></div>';
  }else{
    m.innerHTML='<div class="mcard" role="dialog" aria-labelledby="mt"><h2 id="mt">導覽看完了</h2>'+
      '<p class="lead">剛剛這一場，系統幫老闆做了這些事：</p>'+
      '<ol class="mlist"><li><span>1</span><div>名額自動扣，不會超賣，也不用改貼文</div></li>'+
      '<li><span>2</span><div>自動提醒客人，不用一個一個打電話</div></li>'+
      '<li><span>3</span><div>有人取消，自動通知候補的人補上</div></li>'+
      '<li><span>4</span><div>沒來拿的自動記錄，常犯的人自動暫停</div></li></ol>'+
      '<div class="mbtns"><button class="bigbtn go" data-tour="free">我想自己點點看</button>'+
      '<button class="bigbtn alt" data-tour="start">再看一次導覽</button></div></div>';
  }
}

/* ---------- events ---------- */
function allowedInTour(el){
  var st=TOUR[tour.i];
  if(tour.busy||!st.click)return false;
  var zone=document.querySelector(st.click);
  return !!(zone&&zone.contains(el));
}
document.addEventListener('click',function(e){
  var tb=e.target.closest('[data-tour]');
  if(tb){
    var t=tb.getAttribute('data-tour');
    if(t==='start')startTour();
    else if(t==='free'){tour.on=false;tour.busy=false;document.body.classList.remove('touring');document.getElementById('spot').hidden=true;
      document.getElementById('modal').hidden=true;init();render();toast('已重新開始，可以自己隨便點');}
    else if(t==='next')tourNext();
    else if(t==='back')tourBack();
    else if(t==='close')endTour(false);
    return;
  }
  var el=e.target.closest('[data-act]');
  if(tour.on){
    if(e.target.closest('#sheet'))return;
    if(!el||!allowedInTour(el)){if(el||e.target.closest('.phone,.console,.top'))nudge();return;}
  }
  if(!el)return;
  act(el.getAttribute('data-act'),el.getAttribute('data-v'),el.getAttribute('data-f'));
  render();
  if(tour.on){var st=TOUR[tour.i];if(st.done&&st.done())finishStep();}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(tour.on){render();return;}
  if(t.getAttribute('data-change')==='osess'){S.ownerSession=t.value;render();}
  else if(t.hasAttribute('data-bind'))S.po[t.getAttribute('data-bind')]=t.value;
});
document.addEventListener('input',function(e){
  var t=e.target;if(!tour.on&&t.hasAttribute&&t.hasAttribute('data-bind'))S.po[t.getAttribute('data-bind')]=t.value;
});
window.addEventListener('resize',placeSpot);
document.addEventListener('scroll',placeSpot,true);

init();render();showModal('welcome');
})();
</script>
